name: Build CV

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'cv.tex'
      - 'resume.tex'
      - 'cv/**'
      - 'resume/**'
      - 'awesome-cv.cls'
      - 'fonts/**'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build PDFs
        uses: xu-cheng/latex-action@v3
        with:
          root_file: |
            cv.tex
            resume.tex
          latexmk_use_xelatex: true

      - name: Commit PDFs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add cv.pdf resume.pdf
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "build: update cv.pdf and resume.pdf [skip ci]"
            git push
          fi

      - name: Deploy cv.pdf to cascioli-dev
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          git clone https://x-access-token:${GH_PAT}@github.com/cascioli/cascioli-dev.git /tmp/cascioli-dev
          mkdir -p /tmp/cascioli-dev/public/assets
          cp cv.pdf /tmp/cascioli-dev/public/assets/cv.pdf
          cd /tmp/cascioli-dev
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/assets/cv.pdf
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "build: update cv.pdf [skip ci]"
            git push
          fi
